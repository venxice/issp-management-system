services:
  app:
    build: ./docker/php
    container_name: issp_app
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/apache/000-default.conf:/etc/apache2/sites-available/000-default.conf
    working_dir: /var/www/html
    depends_on:
      - db
    networks:
      - issp_network

  db:
    image: mysql:8.0
    container_name: issp_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: issp_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - issp_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: issp_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db
    networks:
      - issp_network

volumes:
  db_data:

networks:
  issp_network:
